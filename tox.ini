# tox.ini
#
# CI derives the env name as py{major}{minor} from the interpreter version
# (see .github/actions/test); keep envlist in sync with the ci.yml matrix.
# The old [gh-actions] mapping section is gone on purpose: the tox-gh-actions
# plugin was never installed, so the mapping never did anything.

[tox]
envlist = py310, py312, lint
isolated_build = true
skip_missing_interpreters = true

[testenv]
# PIP_CONSTRAINT lets CI pin jax for every install phase in this env,
# including the package-deps resolve (see .github/actions/test).
passenv = PIP_CONSTRAINT
deps =
    pytest
    # LOUD: tests need jax<0.10 until #43 (clip a_min/a_max kwargs) merges,
    # and pyDOE==0.3.8 until #44 (pyDOE to scipy.qmc) merges: pydoe 1.3.0
    # ships a lowercase 'pydoe' module that breaks 'from pyDOE import lhs'.
    # 00b/1c tighten these once those land.
    jax<0.10
    pyDOE==0.3.8
commands = pytest tests

[testenv:lint]
description = Run black and ruff, both pinned; config lives in pyproject.toml
skip_install = true
deps =
    # Pinned on purpose: unpinned formatters broke CI twice over.
    # black 26 changed blank-line formatting and auto-targets newer pythons;
    # ruff 0.16 broadened its default rule set. Bump these deliberately,
    # together with [tool.black] / [tool.ruff] in pyproject.toml.
    black==25.1.0
    ruff==0.16.0
commands =
    black --check jaxbo/ tests/
    ruff check jaxbo/ tests/
