# tox.ini
#
# Local multi-python runner plus the pinned lint env. CI tests install frozen
# from uv.lock instead (see .github/actions/test) and only the lint env runs
# from here in CI (see .github/actions/lint); keep envlist in sync with ci.yml.
# The old [gh-actions] mapping section is gone on purpose: the tox-gh-actions
# plugin was never installed, so the mapping never did anything.

[tox]
envlist = py310, py311, py312, py313, py314, lint
isolated_build = true
skip_missing_interpreters = true

[testenv]
# jax comes from the package pin in pyproject.toml (>=0.6,<0.11); the
# pre-#43/#44 jax<0.10 and pyDOE==0.3.8 constraints are gone, both merged.
deps =
    pytest
commands = pytest tests

[testenv:lint]
description = Run black and ruff, both pinned; config lives in pyproject.toml
skip_install = true
deps =
    # Pinned on purpose: unpinned formatters broke CI twice over.
    # black 26 changed blank-line formatting and auto-targets newer pythons;
    # ruff 0.16 broadened its default rule set. Bump these deliberately,
    # together with [tool.black] / [tool.ruff] in pyproject.toml.
    black==25.1.0
    ruff==0.16.0
commands =
    black --check jaxbo/ tests/
    ruff check jaxbo/ tests/
