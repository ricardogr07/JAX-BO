# tox.ini
[tox]
envlist = py310, lint
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Build the wheel, install it, and run tests
deps =
    build
    pytest
commands =
    python -m build --wheel
    pip install dist/*.whl

[testenv:lint]
description = Run ruff and black
skip_install = true
deps =
    black
    ruff
commands =
    black --check src/ tests/
    ruff check src/ tests/