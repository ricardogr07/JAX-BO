[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxbo"
version = "0.1.2"
description = "Fork of PredictiveIntelligenceLab/JAX-BO with updates and compatibility improvements for Colab and pipelines"
readme = "README.md"
requires-python = ">=3.6"
license = "Apache-2.0"
authors = [
  {name = "Ricardo García Ramírez", email = "rgr.5882@gmail.com"}
]
keywords = ["jax", "bayesian optimization", "machine learning", "optimization"]

dependencies = [
  "numpy",
  # scipy.stats.qmc (the pyDOE replacement) first shipped in scipy 1.7.0
  "scipy>=1.7",
  "jax",
  "jaxlib",
  "scikit-learn",
  "KDEpy",
  "numpyro"
]

[project.optional-dependencies]
bench = [
  "pytest",
  "pytest-benchmark",
]

[project.urls]
homepage = "https://github.com/ricardogr07/JAX-BO"
repository = "https://github.com/ricardogr07/JAX-BO"
documentation = "https://github.com/ricardogr07/JAX-BO"
bug_tracker = "https://github.com/ricardogr07/JAX-BO/issues"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["."]
include = ["jaxbo*"]

[tool.black]
# Formatting contract: explicit py310 target so black never auto-targets a
# python newer than the running interpreter (that broke CI). black itself is
# pinned in the tox.ini lint env; bump both together.
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Explicit rule set: the codebase is clean under the pyflakes/pycodestyle
# subset. ruff 0.16 broadened its defaults (UP, PLR, I, ...); opting out here
# until a deliberate cleanup, so a ruff bump cannot redden CI by itself.
select = ["E4", "E7", "E9", "F"]
