[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxbo"
version = "0.2.0"
description = "Fork of PredictiveIntelligenceLab/JAX-BO with updates and compatibility improvements for Colab and pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  {name = "Ricardo García Ramírez", email = "rgr.5882@gmail.com"}
]
keywords = ["jax", "bayesian optimization", "machine learning", "optimization"]
# Honest support matrix only: 3.10 to 3.14, matching the CI lanes. License is
# the SPDX expression above (PEP 639), so no License :: classifier.
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]

# The core installs with exactly these 4 dependencies (SCOPE.md section 3);
# everything else lives behind the optional extras below.
dependencies = [
  "numpy",
  # scipy.stats.qmc (the pyDOE replacement) first shipped in scipy 1.7.0
  "scipy>=1.7",
  # Tested range. jax 0.10 removed the clip a_min/a_max kwargs (handled in #43);
  # 0.11 is unproven here. SCOPE.md: this ceiling moves only on a green CI run.
  "jax>=0.6,<0.11",
  "jaxlib>=0.6,<0.11",
]

[project.optional-dependencies]
# jaxbo.mcmc: NUTS-based GP models
mcmc = [
  "numpyro",
]
# jaxbo.multifidelity: no third-party deps beyond the core today (the neural
# feature maps use jax's bundled stax); the extra exists as a stable name.
multifidelity = []
# jaxbo.weights: the GMM/KDE weighted-sampling machinery
weighted = [
  "scikit-learn",
  "KDEpy",
]
# Union of the three extras above; keep in sync by hand.
all = [
  "numpyro",
  "scikit-learn",
  "KDEpy",
]
bench = [
  "pytest",
  "pytest-benchmark",
]
# examples/ import matplotlib but it was never declared anywhere
examples = [
  "matplotlib",
]

[dependency-groups]
# Installed by a default uv sync; CI runs pytest from the frozen lock.
# The extras' packages are listed here too (keep in sync with
# [project.optional-dependencies]) so the test environment can exercise the
# extras and their compat shims without a separate --all-extras install.
dev = [
  "pytest",
  "numpyro",
  "scikit-learn",
  "KDEpy",
  # Coverage is reported by the CI test lanes (.github/actions/test); the
  # local tox envs stay plain pytest on purpose.
  "pytest-cov",
]
# The Docker quickstart image only (not installed by a default uv sync, not
# published in the wheel): JupyterLab serving the examples/ notebooks. Lives
# here so the image installs it frozen from uv.lock like everything else.
docker = [
  "jupyterlab",
]

[project.urls]
homepage = "https://github.com/ricardogr07/JAX-BO"
repository = "https://github.com/ricardogr07/JAX-BO"
documentation = "https://github.com/ricardogr07/JAX-BO"
bug_tracker = "https://github.com/ricardogr07/JAX-BO/issues"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["."]
include = ["jaxbo*"]

[tool.black]
# Formatting contract: explicit py310 target so black never auto-targets a
# python newer than the running interpreter (that broke CI). black itself is
# pinned in the tox.ini lint env; bump both together.
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Explicit rule set: the codebase is clean under the pyflakes/pycodestyle
# subset. ruff 0.16 broadened its defaults (UP, PLR, I, ...); opting out here
# until a deliberate cleanup, so a ruff bump cannot redden CI by itself.
select = ["E4", "E7", "E9", "F"]
