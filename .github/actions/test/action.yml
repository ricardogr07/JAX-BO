name: test
description: >
  Install the project frozen from the committed uv.lock, apply the per-lane
  jax pin, and run pytest. Requires checkout + setup-env.

inputs:
  python-version:
    description: Python version (major.minor is enough) for the synced venv
    required: true
  jax-spec:
    description: >
      pip requirement spec for jax, applied as an explicit post-sync pin.
      The lock resolves one jax per python range (0.6.2 on 3.10, 0.10.2 on
      3.11+), but the matrix deliberately tests the floor and the newest
      installable jax per interpreter, so each lane re-pins jax after the
      frozen sync; uv resolves the matching jaxlib alongside.
    required: true

runs:
  using: composite
  steps:
    - name: Sync locked environment
      shell: bash
      # Issue #25: CI installs frozen from the committed lockfile.
      run: uv sync --frozen --python "${{ inputs.python-version }}"

    - name: Apply per-lane jax pin
      shell: bash
      # numpyro is named here so it co-resolves with the lane's jax: it tracks
      # jax.extend closely (the locked numpyro 0.21.0 imports jit_p from
      # jax.extend.core.primitives, which jax 0.5.3 lacks), so floor lanes need
      # uv to pick the numpyro that matches the pinned jax, not the locked one.
      run: uv pip install "${{ inputs.jax-spec }}" numpyro

    - name: Run tests
      shell: bash
      # --no-sync so uv run does not restore the locked jax over the lane pin.
      run: uv run --no-sync pytest tests
