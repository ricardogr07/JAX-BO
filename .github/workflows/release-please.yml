name: Release Please

# Gated on CI: runs only after the CI workflow (whose aggregate check is ci-ok)
# completes successfully on main, instead of on every push.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Both conditions matter: success alone is not enough, because an OLDER
    # CI run can finish green after a newer commit became the main head
    # (push runs are not auto-cancelled). head_sha == github.sha pins this
    # job to CI runs for the current head; a superseded run is skipped and
    # the newer commit's own CI completion re-triggers release-please.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha
    steps:
      - name: Release Please
        # Manifest mode: version policy lives in release-please-config.json
        # (bump-minor-pre-major keeps pre-1.0 breaking changes on 0.x).
        uses: googleapis/release-please-action@v4
        with:
          # A PAT, not the default GITHUB_TOKEN: GitHub suppresses workflow
          # events from GITHUB_TOKEN, so the tag it pushes would never fire
          # release.yml (issue #66).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
