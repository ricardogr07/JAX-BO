name: Release Please

# Gated on CI: runs only after the CI workflow (whose aggregate check is ci-ok)
# completes successfully on main, instead of on every push.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: python
