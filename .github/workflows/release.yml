name: Publish Python distribution to PyPI

# Tag push only. Once release-please authenticates with a PAT (issue #66) it
# emits both a tag push and a release-created event; triggering on both would
# start two concurrent runs racing on the :latest docker tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


jobs:
  # Gate: refuse to publish unless the ci-ok check succeeded on this exact commit.
  # Tags are cut from main after a CI-gated merge, so a legitimate tag always has one.
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful ci-ok check run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=ci-ok" \
            --jq '[.check_runs[].conclusion] | last')
          echo "ci-ok conclusion on ${{ github.sha }}: ${conclusion:-none}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci-ok has not succeeded on this commit; refusing to publish"
            exit 1
          fi

  build-and-publish:
    runs-on: ubuntu-latest
    needs: verify-ci
    environment: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build
      
      - name: Display build artifacts
        run: ls -lh dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Docker quickstart image (issue #39): jaxbo[all] + JupyterLab + examples/,
  # installed frozen from the committed uv.lock. The image mirrors the
  # release, so it publishes only for a real release trigger (v* tag or
  # release event, never a branch workflow_dispatch, which must not be able
  # to overwrite :latest) and only after the PyPI publish succeeded (a
  # failed PyPI upload must not leave a public container claiming that
  # version).
  docker-publish:
    runs-on: ubuntu-latest
    needs: [verify-ci, build-and-publish]
    if: (github.ref_type == 'tag' && github.event_name == 'push') || github.event_name == 'release'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        # The job-level guard means the ref is always the release tag here,
        # so the version tag derives from it directly.
        run: docker build -t ghcr.io/ricardogr07/jaxbo:latest -t "ghcr.io/ricardogr07/jaxbo:${GITHUB_REF_NAME#v}" .

      - name: Push image
        run: docker push --all-tags ghcr.io/ricardogr07/jaxbo
