name: CI

on:
  # No base-branch filter on pull_request: stacked PRs (base = another feature
  # branch) must get CI too, and the gate scopes work by changed paths anyway.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.flags.outputs.docs_only }}
      core: ${{ steps.flags.outputs.core }}
      bench: ${{ steps.flags.outputs.bench }}
      ci_config: ${{ steps.filter.outputs.ci_config }}
    steps:
      # Checkout is needed for push events; paths-filter reads local git history there.
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2, pinned to a full commit SHA
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
            core:
              - 'jaxbo/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'tox.ini'
            bench:
              - 'benchmarks/**'
            ci_config:
              - '.github/**'

      - name: Compute effective flags
        id: flags
        env:
          DOCS: ${{ steps.filter.outputs.docs }}
          CORE: ${{ steps.filter.outputs.core }}
          BENCH: ${{ steps.filter.outputs.bench }}
          CI_CONFIG: ${{ steps.filter.outputs.ci_config }}
        run: |
          # Gating map: .github/** runs everything; docs_only means markdown/docs
          # changed and nothing else did.
          core=false; bench=false; docs_only=false
          if [ "$CORE" = "true" ] || [ "$CI_CONFIG" = "true" ]; then core=true; fi
          if [ "$BENCH" = "true" ] || [ "$CI_CONFIG" = "true" ]; then bench=true; fi
          if [ "$DOCS" = "true" ] && [ "$CORE" != "true" ] && [ "$BENCH" != "true" ] && [ "$CI_CONFIG" != "true" ]; then docs_only=true; fi
          {
            echo "core=$core"
            echo "bench=$bench"
            echo "docs_only=$docs_only"
          } >> "$GITHUB_OUTPUT"
          echo "flags: core=$core bench=$bench docs_only=$docs_only ci_config=$CI_CONFIG"

  lint:
    name: lint
    needs: gate
    if: needs.gate.outputs.docs_only == 'true' || needs.gate.outputs.core == 'true' || needs.gate.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain
        if: needs.gate.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Lint
        uses: ./.github/actions/lint
        with:
          scope: ${{ needs.gate.outputs.docs_only == 'true' && 'docs' || 'full' }}

  test:
    name: test (py${{ matrix.python-version }}, jax ${{ matrix.lane }})
    needs: gate
    if: needs.gate.outputs.core == 'true'
    runs-on: ubuntu-latest
    # 3.13/3.14 lanes are advisory (continue-on-error) until they hold a green
    # streak; promotion path: flip experimental to false for a version once its
    # lanes have stayed green for a week of runs, making them blocking.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # jax wheel reality per python version (PyPI metadata, checked 2026-07-28):
        #   requires_python: jax 0.4.x to 0.6.x need >=3.10; 0.7.x to 0.10.x
        #   need >=3.11; 0.11.0 needs >=3.12.
        #   jaxlib wheels: cp310 ends at 0.6.2; cp311 ends at 0.10.2;
        #   cp313 exists from 0.5.3; cp314 exists only from 0.7.2.
        # floor = oldest installable jax per interpreter (0.5.3 everywhere it has
        # wheels, 0.7.2 on 3.14). latest lanes are capped at jax<0.10 until #43
        # (clip kwargs) and #44 (pyDOE) merge; the true latest to promote to is
        # noted per lane. py3.10 is terminal at 0.6.2: no newer jax will ever
        # support it, the cap changes nothing there.
        include:
          - { python-version: "3.10", lane: floor,  jax-spec: "jax==0.5.3", experimental: false }
          - { python-version: "3.10", lane: latest, jax-spec: "jax==0.6.2", experimental: false } # terminal latest for 3.10
          - { python-version: "3.11", lane: floor,  jax-spec: "jax==0.5.3", experimental: false }
          - { python-version: "3.11", lane: latest, jax-spec: "jax<0.10",   experimental: false } # promote to jax==0.10.2 after #43/#44
          - { python-version: "3.12", lane: floor,  jax-spec: "jax==0.5.3", experimental: false }
          - { python-version: "3.12", lane: latest, jax-spec: "jax<0.10",   experimental: false } # promote to jax==0.11.0 after #43/#44
          - { python-version: "3.13", lane: floor,  jax-spec: "jax==0.5.3", experimental: true }
          - { python-version: "3.13", lane: latest, jax-spec: "jax<0.10",   experimental: true }  # promote to jax==0.11.0 after #43/#44
          - { python-version: "3.14", lane: floor,  jax-spec: "jax==0.7.2", experimental: true }  # first jaxlib with cp314 wheels
          - { python-version: "3.14", lane: latest, jax-spec: "jax<0.10",   experimental: true }  # promote to jax==0.11.0 after #43/#44
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test
        uses: ./.github/actions/test
        with:
          python-version: ${{ matrix.python-version }}
          jax-spec: ${{ matrix.jax-spec }}

  bench-smoke:
    name: bench smoke
    needs: gate
    if: needs.gate.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.12"

      - name: Benchmark smoke (collection only, no timing)
        shell: bash
        run: |
          # ponytail: the guard exists because the bench harness PR has not merged
          # yet; delete the else branch once benchmarks/ lands on main.
          if [ -d benchmarks ]; then
            # LOUD: jax<0.10 until #43 (clip kwargs) merges and pyDOE==0.3.8
            # until #44 merges (pydoe 1.3.0 breaks the pyDOE module name).
            uv pip install --system -e . pytest pytest-benchmark "jax<0.10" "pyDOE==0.3.8"
            pytest benchmarks --benchmark-disable
          else
            echo "benchmarks/ not present on this branch; nothing to smoke"
          fi

  ci-ok:
    name: ci-ok
    needs: [gate, lint, test, bench-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify needed jobs succeeded or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          # succeeded-or-skipped pattern: skipped is fine, failure or cancellation is not.
          if grep -Eq '"result": *"(failure|cancelled)"' <<< "$NEEDS_JSON"; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
          echo "all needed jobs succeeded or were skipped"
